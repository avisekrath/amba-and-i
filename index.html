<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Amba & I</title>
<meta name="description" content="A daily fitness tracker for Amba and Avisek — training, walks, meals, prep.">
<meta name="theme-color" content="#F5F3ED" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14170F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Amba & I">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="icon" href="./favicon.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="./icon-180.png">
<style>
  :root {
    --ground: #F5F3ED;
    --card: #FFFFFF;
    --card-2: #FAF8F2;
    --ink: #1F2820;
    --ink-soft: #37423A;
    --muted: #6B7568;
    --muted-2: #8C9488;
    --divider: #E1DED4;
    --divider-strong: #C9C4B6;
    --strength: #B54724;
    --strength-soft: #EED8CD;
    --steps: #2F5F3E;
    --steps-soft: #D5E3D6;
    --nutrition: #8B6F1F;
    --nutrition-soft: #EFE1BE;
    --rest: #6B7568;
    --rest-soft: #E1DED4;
    --shadow: 0 -2px 12px rgba(31, 40, 32, 0.06);

    --serif: "Charter", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", "Menlo", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #14170F;
      --card: #1D2118;
      --card-2: #232820;
      --ink: #E8E6DE;
      --ink-soft: #C7C5BC;
      --muted: #9AA394;
      --muted-2: #7F887A;
      --divider: #2E3329;
      --divider-strong: #3C4237;
      --strength: #E06B44;
      --strength-soft: #3A2119;
      --steps: #6DA97F;
      --steps-soft: #1E2E22;
      --nutrition: #D4A83E;
      --nutrition-soft: #332912;
      --rest: #9AA394;
      --rest-soft: #262B22;
      --shadow: 0 -2px 12px rgba(0, 0, 0, 0.4);
    }
  }
  :root[data-theme="dark"] {
    --ground: #14170F;
    --card: #1D2118;
    --card-2: #232820;
    --ink: #E8E6DE;
    --ink-soft: #C7C5BC;
    --muted: #9AA394;
    --muted-2: #7F887A;
    --divider: #2E3329;
    --divider-strong: #3C4237;
    --strength: #E06B44;
    --strength-soft: #3A2119;
    --steps: #6DA97F;
    --steps-soft: #1E2E22;
    --nutrition: #D4A83E;
    --nutrition-soft: #332912;
    --rest: #9AA394;
    --rest-soft: #262B22;
    --shadow: 0 -2px 12px rgba(0, 0, 0, 0.4);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  html, body { margin: 0; padding: 0; overscroll-behavior-y: contain; }
  body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    padding-top: env(safe-area-inset-top);
  }

  .app {
    max-width: 520px;
    margin: 0 auto;
    min-height: 100vh;
    padding-bottom: calc(84px + env(safe-area-inset-bottom));
    position: relative;
  }

  /* HEADER */
  .head {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--ground);
    padding: 14px 20px 12px;
    border-bottom: 1px solid var(--divider);
  }
  .head-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .toggle {
    display: inline-flex;
    background: var(--card-2);
    border: 1px solid var(--divider);
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
  }
  .toggle button {
    background: transparent;
    border: 0;
    padding: 7px 18px;
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--muted);
    border-radius: 999px;
    cursor: pointer;
  }
  .toggle button.active {
    background: var(--ink);
    color: var(--ground);
  }
  .date-nav {
    display: flex;
    align-items: center;
    gap: 2px;
  }
  .date-nav button {
    background: transparent;
    border: 1px solid var(--divider);
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink);
    cursor: pointer;
    font-family: var(--sans);
    font-size: 16px;
    font-weight: 500;
  }
  .date-nav button:active { background: var(--card-2); }

  .date-block {
    margin-top: 14px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }
  .date-day {
    font-family: var(--serif);
    font-size: 32px;
    line-height: 1;
    color: var(--ink);
    letter-spacing: -0.01em;
    font-weight: 500;
  }
  .date-full-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-top: 4px;
  }
  .date-full {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.02em;
  }
  .today-link {
    background: transparent;
    border: 0;
    padding: 0;
    font-family: var(--sans);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--strength);
    cursor: pointer;
  }
  .today-link:active { opacity: 0.6; }
  .day-kind {
    font-family: var(--sans);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .day-kind.lift { background: var(--strength-soft); color: var(--strength); }
  .day-kind.rest { background: var(--rest-soft); color: var(--rest); }
  .day-kind.prep { background: var(--nutrition-soft); color: var(--nutrition); }
  .day-kind.lift-prep { background: var(--strength-soft); color: var(--strength); }

  .day-progress {
    margin-top: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .progress-track {
    flex: 1;
    height: 4px;
    background: var(--card-2);
    border-radius: 999px;
    overflow: hidden;
    border: 1px solid var(--divider);
  }
  .progress-fill {
    height: 100%;
    background: var(--steps);
    border-radius: 999px;
    transition: width 0.15s ease-out;
  }
  .progress-text {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  main { padding: 20px 20px 24px; }

  .tab-title {
    font-family: var(--serif);
    font-size: 22px;
    color: var(--ink);
    margin: 0 0 4px;
    font-weight: 500;
    letter-spacing: -0.005em;
  }
  .tab-sub {
    font-family: var(--serif);
    font-style: italic;
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 20px;
  }

  /* OVERVIEW */
  .over-week {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 4px;
    margin: 0 0 24px;
  }
  .over-day {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    min-width: 0;
    padding: 8px 2px;
    border-radius: 10px;
    background: var(--card);
    border: 1px solid var(--divider);
    cursor: pointer;
    text-align: center;
  }
  .over-day.today {
    border-color: var(--ink);
    background: var(--ink);
  }
  .over-day.today .over-day-dow { color: var(--ground); }
  .over-day.today .over-day-num { color: var(--ground); }
  .over-day.today .over-day-tag { color: var(--ground); opacity: 0.7; }
  .over-day-dow {
    font-family: var(--sans);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .over-day-num {
    font-family: var(--serif);
    font-size: 18px;
    color: var(--ink);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .over-day-tag {
    display: block;
    max-width: 100%;
    font-family: var(--mono);
    font-size: 7px;
    color: var(--muted);
    letter-spacing: 0.02em;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    height: 10px;
  }
  .over-day-dot {
    display: block;
    flex-shrink: 0;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    margin-top: 2px;
  }

  .over-panel {
    background: var(--card);
    border: 1px solid var(--divider);
    padding: 18px 20px;
    margin-bottom: 16px;
  }
  .over-panel h3 {
    font-family: var(--sans);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 700;
    margin: 0 0 12px;
  }
  .over-numbers {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
  }
  .over-num {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }
  .over-num .k {
    font-family: var(--sans);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
  }
  .over-num .v {
    font-family: var(--serif);
    font-size: 22px;
    color: var(--ink);
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }
  .over-num .u {
    font-family: var(--serif);
    font-style: italic;
    font-size: 13px;
    color: var(--muted);
    margin-top: 2px;
  }

  .over-progress {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .over-row {
    display: grid;
    grid-template-columns: 52px minmax(0, 1fr) 40px;
    gap: 10px;
    align-items: center;
    cursor: pointer;
    padding: 4px 0;
  }
  .over-row:active { background: var(--card-2); }
  .over-row-label {
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    letter-spacing: 0.02em;
  }
  .over-row-bar {
    height: 8px;
    background: var(--card-2);
    border-radius: 999px;
    overflow: hidden;
    border: 1px solid var(--divider);
  }
  .over-row-fill {
    height: 100%;
    border-radius: 999px;
  }
  .over-row-fill.prep { background: var(--nutrition); }
  .over-row-fill.shop { background: var(--nutrition); }
  .over-row-fill.eat  { background: var(--nutrition); }
  .over-row-fill.move { background: var(--strength); }
  .over-row-count {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  .over-journey {
    background: var(--card-2);
    border: 1px dashed var(--divider-strong);
    padding: 16px 20px;
    margin-top: 4px;
  }
  .over-journey .m {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .over-journey .l {
    font-family: var(--serif);
    font-size: 15px;
    color: var(--ink);
    font-style: italic;
    line-height: 1.5;
    margin-bottom: 8px;
  }
  .over-journey .t {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    padding-top: 8px;
    border-top: 1px dashed var(--divider);
    font-variant-numeric: tabular-nums;
  }
  .over-journey .t b { color: var(--ink); font-weight: 500; }

  /* TASK LIST */
  .task-list { display: flex; flex-direction: column; }
  .task {
    display: grid;
    grid-template-columns: 22px 46px minmax(0, 1fr);
    gap: 10px;
    padding: 14px 0;
    align-items: baseline;
    border-bottom: 1px dashed var(--divider);
    cursor: pointer;
  }
  .task:last-child { border-bottom: 0; }
  .task:active { background: var(--card-2); }

  .cbox {
    width: 22px;
    height: 22px;
    border: 1.5px solid var(--divider-strong);
    border-radius: 6px;
    background: var(--card);
    position: relative;
    flex-shrink: 0;
    transform: translateY(3px);
  }
  .task.done .cbox, .exercise.done .cbox {
    background: var(--steps);
    border-color: var(--steps);
  }
  .task.done .cbox::after, .exercise.done .cbox::after {
    content: "";
    position: absolute;
    left: 6px;
    top: 2px;
    width: 6px;
    height: 11px;
    border-right: 2px solid var(--card);
    border-bottom: 2px solid var(--card);
    transform: rotate(45deg);
  }
  .task-time {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
    padding-top: 3px;
  }
  .task-body { min-width: 0; }
  .task-name {
    font-family: var(--sans);
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
    line-height: 1.35;
  }
  .task.done .task-name {
    color: var(--muted);
    text-decoration: line-through;
    text-decoration-color: var(--divider-strong);
  }
  .task-hint {
    font-family: var(--serif);
    font-style: italic;
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
    line-height: 1.4;
  }
  .task.done .task-hint {
    text-decoration: line-through;
    text-decoration-color: var(--divider);
  }

  .meal-slot {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--nutrition);
    font-weight: 700;
    margin-bottom: 3px;
    display: block;
  }
  .meal-portion {
    display: block;
    font-family: var(--serif);
    font-style: italic;
    font-size: 13px;
    color: var(--muted);
    margin-top: 4px;
    line-height: 1.4;
  }
  .meal-portion b {
    font-style: normal;
    font-family: var(--sans);
    font-weight: 500;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }

  .move-section { margin-top: 24px; }
  .move-section:first-child { margin-top: 0; }
  .move-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-bottom: 10px;
    margin-bottom: 4px;
    border-bottom: 1px solid var(--divider);
  }
  .move-head h3 {
    font-family: var(--sans);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink);
    font-weight: 700;
    margin: 0;
  }
  .move-head .meta {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .lift-block {
    background: var(--card);
    border: 1px solid var(--divider);
    border-left: 3px solid var(--strength);
    padding: 16px 18px;
    margin-bottom: 24px;
  }
  .lift-title {
    font-family: var(--serif);
    font-size: 18px;
    color: var(--ink);
    margin: 0 0 4px;
    line-height: 1.2;
  }
  .lift-when {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 12px;
    letter-spacing: 0.02em;
  }
  .lift-note {
    background: var(--card-2);
    border-left: 2px solid var(--divider-strong);
    padding: 8px 12px;
    margin: 12px 0 8px;
    font-family: var(--serif);
    font-style: italic;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.5;
  }
  .exercises { display: flex; flex-direction: column; }
  .exercise {
    display: grid;
    grid-template-columns: 22px minmax(0, 1fr) auto;
    gap: 10px;
    padding: 12px 0;
    align-items: baseline;
    border-bottom: 1px dashed var(--divider);
    cursor: pointer;
  }
  .exercise:last-child { border-bottom: 0; }
  .exercise-name {
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 500;
    color: var(--ink);
    line-height: 1.35;
  }
  .exercise-swap {
    display: block;
    font-family: var(--serif);
    font-style: italic;
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }
  .exercise.done .exercise-name {
    color: var(--muted);
    text-decoration: line-through;
    text-decoration-color: var(--divider-strong);
  }
  .exercise-sets {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink);
    text-align: right;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    line-height: 1.4;
  }
  .exercise-sets .w {
    display: block;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.04em;
  }

  .empty {
    text-align: center;
    padding: 60px 20px;
    font-family: var(--serif);
    font-style: italic;
    color: var(--muted);
    font-size: 15px;
    line-height: 1.5;
  }
  .empty-icon {
    font-family: var(--serif);
    font-size: 40px;
    color: var(--divider-strong);
    display: block;
    margin-bottom: 12px;
    line-height: 1;
  }

  .marinades-ref { margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--divider); }
  .marinades-ref-head {
    font-family: var(--sans);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 700;
    margin-bottom: 12px;
  }
  .marinade-mini {
    display: grid;
    grid-template-columns: 68px minmax(0, 1fr);
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px dashed var(--divider);
    align-items: baseline;
  }
  .marinade-mini:last-child { border-bottom: 0; }
  .marinade-mini h4 {
    font-family: var(--serif);
    font-size: 14px;
    font-weight: 500;
    color: var(--nutrition);
    margin: 0;
  }
  .marinade-mini p {
    font-family: var(--serif);
    font-style: italic;
    font-size: 12px;
    color: var(--muted);
    margin: 0;
    line-height: 1.5;
  }

  .macros-card {
    background: var(--card);
    border: 1px solid var(--divider);
    border-left: 3px solid var(--nutrition);
    padding: 12px 16px;
    margin-bottom: 20px;
    display: flex;
    gap: 20px;
    align-items: baseline;
  }
  .macros-card > div { display: flex; flex-direction: column; gap: 2px; }
  .macros-card .k {
    font-family: var(--sans);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 700;
  }
  .macros-card .v {
    font-family: var(--serif);
    font-size: 20px;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }

  /* BOTTOM TABS */
  .tabs {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 30;
    background: var(--ground);
    border-top: 1px solid var(--divider);
    box-shadow: var(--shadow);
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
  }
  .tabs-inner {
    max-width: 520px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: 2px;
  }
  .tabs button {
    background: transparent;
    border: 0;
    padding: 8px 1px 6px;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    cursor: pointer;
    border-radius: 10px;
    font-family: var(--sans);
    color: var(--muted);
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    position: relative;
  }
  .tabs button.active { color: var(--ink); }
  .tabs button.active::before {
    content: "";
    position: absolute;
    top: 0;
    left: 25%;
    right: 25%;
    height: 2px;
    background: var(--strength);
    border-radius: 999px;
  }
  .tab-icon {
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;

  const DAY_INDEX = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];

  // ---------- STATE ----------
  const KEY = 'rd:v1';
  const loadState = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } };
  const saveState = (s) => { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch {} };
  let state = loadState();
  if (!state.user)    state.user    = 'i';
  if (!state.tab)     state.tab     = 'over';
  if (!state.checks)  state.checks  = {};
  if (!state.date)    state.date    = todayISO();
  if (!state.goals)   state.goals   = { i: { kcal: 2400, protein: 150 }, a: { kcal: 1500, protein: 120 } };
  if (!state.weights) state.weights = { i: {}, a: {} };
  if (!state.burns)   state.burns   = { i: {}, a: {} };
  saveState(state);

  function getGoal(u) { return state.goals[u] || { kcal: 2400, protein: 150 }; }
  function fmtGoal(v, unit) { return v.toLocaleString() + (unit ? ' ' + unit : ''); }
  function getWeight(u, date) { return state.weights[u] && state.weights[u][date]; }
  function setWeight(u, date, val) {
    if (!state.weights[u]) state.weights[u] = {};
    if (val == null || val === '' || isNaN(val)) delete state.weights[u][date];
    else state.weights[u][date] = Number(val);
    saveState(state);
  }
  function getBurn(u, date) { return state.burns[u] && state.burns[u][date]; }
  function setBurn(u, date, val) {
    if (!state.burns[u]) state.burns[u] = {};
    if (val == null || val === '' || isNaN(val)) delete state.burns[u][date];
    else state.burns[u][date] = Number(val);
    saveState(state);
  }
  function latestWeightBefore(u, date) {
    const w = state.weights[u] || {};
    const dates = Object.keys(w).filter(d => d <= date).sort();
    if (!dates.length) return null;
    return { date: dates[dates.length - 1], value: w[dates[dates.length - 1]] };
  }

  function todayISO() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  function parseISO(iso) { return new Date(iso + 'T00:00:00'); }
  function fmtISO(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  function shiftDate(iso, delta) {
    const d = parseISO(iso); d.setDate(d.getDate() + delta); return fmtISO(d);
  }
  function isChecked(id, date) {
    const k = `${state.user}:${date || state.date}`;
    return !!(state.checks[k] && state.checks[k][id]);
  }
  function setChecked(id, val) {
    const k = `${state.user}:${state.date}`;
    if (!state.checks[k]) state.checks[k] = {};
    if (val) state.checks[k][id] = true; else delete state.checks[k][id];
    if (Object.keys(state.checks[k]).length === 0) delete state.checks[k];
    saveState(state);
  }
  function dowFromISO(iso) { return parseISO(iso).getDay(); }

  function taskIdsForDay(day, tabKey, date) {
    const iso = date || state.date;
    const dayKey = DAY_INDEX[dowFromISO(iso)];
    if (tabKey === 'prep') return day.prep.map(t => t.id);
    if (tabKey === 'shop') return day.shop.map(t => t.id);
    if (tabKey === 'eat')  return day.eat.map(t => t.id);
    if (tabKey === 'move') {
      const ids = day.move.walks.map(w => w.id);
      ids.push(`${dayKey}-mv-steps`);
      if (day.move.lift) {
        SESSIONS[day.move.lift.session].exercises.forEach((_, i) => ids.push(`${dayKey}-mv-lift-${i}`));
      }
      return ids;
    }
    if (tabKey === 'over') return []; // overview aggregates the others
    return [];
  }

  function dayProgress(day, date) {
    const iso = date || state.date;
    let done = 0, total = 0;
    ['prep','shop','eat','move'].forEach(t => {
      const ids = taskIdsForDay(day, t, iso);
      total += ids.length;
      done += ids.filter(id => isChecked(id, iso)).length;
    });
    return { done, total };
  }

  // ---------- RENDER HELPERS ----------
  function el(tag, attrs, children) {
    const e = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      if (k === 'class') e.className = attrs[k];
      else if (k === 'html') e.innerHTML = attrs[k];
      else if (k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
      else if (attrs[k] != null) e.setAttribute(k, attrs[k]);
    }
    if (children != null) {
      if (Array.isArray(children)) children.forEach(c => c && e.append(c.nodeType ? c : document.createTextNode(c)));
      else e.append(children.nodeType ? children : document.createTextNode(children));
    }
    return e;
  }

  function makeTask(t) {
    const done = isChecked(t.id);
    const recipeKey = PREP_RECIPES[t.id];
    const children = [
      el('div', { class: 'cbox' }),
      el('div', { class: 'task-time' }, t.time || ''),
      el('div', { class: 'task-body' }, [
        el('div', { class: 'task-name' }, t.text),
        t.hint ? el('div', { class: 'task-hint' }, t.hint) : null
      ].filter(Boolean))
    ];
    if (recipeKey && RECIPES[recipeKey]) {
      children.push(el('button', {
        class: 'task-recipe',
        'aria-label': 'View recipe for ' + t.text,
        onClick: (evt) => { evt.stopPropagation(); openRecipe(recipeKey); }
      }, [ el('span', { html: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>' }) ]));
    }
    return el('div', {
      class: 'task' + (done ? ' done' : '') + (recipeKey ? ' has-recipe' : ''),
      onClick: () => { setChecked(t.id, !done); renderAll(); }
    }, children);
  }

  function makeMealTask(m) {
    const done = isChecked(m.id);
    const portion = m[state.user];
    return el('div', {
      class: 'task' + (done ? ' done' : ''),
      onClick: () => { setChecked(m.id, !done); renderAll(); }
    }, [
      el('div', { class: 'cbox' }),
      el('div', { class: 'task-time' }, m.time),
      el('div', { class: 'task-body' }, [
        el('span', { class: 'meal-slot' }, m.slot),
        el('div', { class: 'task-name' }, m.name),
        el('div', { class: 'task-hint' }, portion.p),
        el('span', { class: 'meal-portion' }, [ el('b', {}, portion.v) ])
      ])
    ]);
  }

  // ---------- TAB RENDERERS ----------
  function renderOverview(day) {
    const dow = dowFromISO(state.date);
    const wrap = el('div');

    // Weekly strip — 7 days centered on this week
    const start = parseISO(state.date);
    start.setDate(start.getDate() - dow); // back to Sunday
    const strip = el('div', { class: 'over-week' });
    for (let i = 0; i < 7; i++) {
      const d = new Date(start); d.setDate(start.getDate() + i);
      const iso = fmtISO(d);
      const dayObj = DAYS[DAY_INDEX[d.getDay()]];
      const prog = dayProgress(dayObj, iso);
      let dotColor = 'var(--divider-strong)';
      if (prog.done > 0 && prog.done < prog.total) dotColor = 'var(--nutrition)';
      if (prog.total > 0 && prog.done === prog.total) dotColor = 'var(--steps)';
      const isToday = iso === state.date;
      const tag = dayObj.kind.includes('lift') ? 'Lift' : (dayObj.kind === 'prep' ? 'Prep' : 'Rest');
      strip.append(el('div', {
        class: 'over-day' + (isToday ? ' today' : ''),
        onClick: () => { state.date = iso; saveState(state); renderAll(); }
      }, [
        el('span', { class: 'over-day-dow' }, ['S','M','T','W','T','F','S'][d.getDay()]),
        el('span', { class: 'over-day-num' }, String(d.getDate())),
        el('span', { class: 'over-day-tag' }, tag),
        // Color set inline (not via a modifier class) — a compound class selector here
        // triggers a layout-sizing bug in some browsers when repeated across 7 sibling
        // grid items (the dot inflates from 4x4 to ~40x120). Inline style sidesteps it.
        el('div', { class: 'over-day-dot', style: 'background:' + dotColor })
      ]));
    }
    wrap.append(strip);

    // Today's numbers (goals from settings, weight if logged)
    const goal = getGoal(state.user);

  // ---------- LOG TAB ----------
  function renderLog(day) {
    const iso = state.date;
    const u = state.user;
    const goal = getGoal(u);

    // Estimate eaten kcal proportional to meals checked
    const eatIds = day.eat.map(m => m.id);
    const eaten = eatIds.filter(id => isChecked(id)).length;
    const total = eatIds.length;
    const eatenKcal = total === 0 ? 0 : Math.round((eaten / total) * goal.kcal);

    const burn = getBurn(u, iso) || 0;
    // Balance: goal kcal - eaten + burn. Positive number = deficit (good if losing).
    const balance = goal.kcal - eatenKcal + burn;
    const isDef = balance > 0;

    const w = getWeight(u, iso);
    const latestPrev = latestWeightBefore(u, iso);
    const weekAgoIso = shiftDate(iso, -7);
    const wk = latestWeightBefore(u, weekAgoIso);

    const wrap = el('div', {}, [
      el('h2', { class: 'tab-title' }, 'Log'),
      el('p', { class: 'tab-sub' }, `${USERS[u].name}, ${new Date(parseISO(iso)).toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'short' })}.`)
    ]);

    // Weight card
    const wIn = el('input', {
      type: 'number', inputmode: 'decimal', step: '0.1',
      min: '30', max: '200',
      placeholder: '—', value: w != null ? w : '',
      onInput: (e) => { setWeight(u, iso, e.target.value); },
      onBlur: () => renderAll()
    });
    const wCard = el('div', { class: 'log-card' }, [
      el('h3', {}, 'Weight'),
      el('div', { class: 'log-input-row' }, [ wIn, el('span', { class: 'unit' }, 'kg') ]),
      el('div', { class: 'log-help' }, 'Weigh Sunday mornings, fasted, same scale. Log daily if you want the trend.')
    ]);

    // Weight summary (delta since last entry, delta week over week)
    const summary = el('div', { class: 'weight-summary' });
    if (latestPrev && latestPrev.date !== iso) {
      const d = (w != null ? w : latestPrev.value) - latestPrev.value;
      summary.append(el('div', { class: 'weight-cell' }, [
        el('div', { class: 'k' }, 'Since last log'),
        el('div', { class: 'v ' + (d > 0 ? 'pos' : (d < 0 ? 'neg' : '')) },
          (d >= 0 ? '+' : '') + d.toFixed(1) + ' kg')
      ]));
    }
    if (wk) {
      const ref = w != null ? w : (latestPrev ? latestPrev.value : null);
      if (ref != null) {
        const d = ref - wk.value;
        summary.append(el('div', { class: 'weight-cell' }, [
          el('div', { class: 'k' }, 'Vs 7 days ago'),
          el('div', { class: 'v ' + (d > 0 ? 'pos' : (d < 0 ? 'neg' : '')) },
            (d >= 0 ? '+' : '') + d.toFixed(1) + ' kg')
        ]));
      }
    }
    if (summary.children.length > 0) wCard.append(summary);
    // Sparkline of last 14 days (fill in missing days with previous known value)
    const spark = buildSparkline(u, iso);
    if (spark) wCard.append(spark);
    wrap.append(wCard);

    // Calorie burn card
    const bIn = el('input', {
      type: 'number', inputmode: 'numeric', step: '10',
      min: '0', max: '3000',
      placeholder: '0', value: burn ? burn : '',
      onInput: (e) => { setBurn(u, iso, e.target.value); },
      onBlur: () => renderAll()
    });
    wrap.append(el('div', { class: 'log-card' }, [
      el('h3', {}, 'Calorie burn'),
      el('div', { class: 'log-input-row' }, [ bIn, el('span', { class: 'unit' }, 'kcal') ]),
      el('div', { class: 'log-help' }, 'From your watch or an honest estimate. Just extra activity above your daily normal — the lift session, long walks.')
    ]));

    // Daily balance
    wrap.append(el('div', { class: 'log-card' }, [
      el('h3', {}, 'Today vs goal'),
      el('div', { class: 'balance-grid' }, [
        el('div', { class: 'balance-cell' }, [
          el('span', { class: 'k' }, 'Goal in'),
          el('span', { class: 'v' }, goal.kcal.toLocaleString())
        ]),
        el('div', { class: 'balance-cell' }, [
          el('span', { class: 'k' }, 'Eaten'),
          el('span', { class: 'v' }, '~' + eatenKcal.toLocaleString())
        ]),
        el('div', { class: 'balance-cell' }, [
          el('span', { class: 'k' }, 'Burned'),
          el('span', { class: 'v' }, burn ? '+' + burn.toLocaleString() : '—')
        ])
      ]),
      el('div', { class: 'balance-total ' + (isDef ? 'deficit' : 'surplus') }, [
        el('div', { class: 'k' }, isDef ? 'Deficit' : 'Surplus'),
        el('div', { class: 'v' }, (isDef ? '−' : '+') + Math.abs(balance).toLocaleString() + ' kcal'),
        el('div', { class: 'u' }, eaten + ' of ' + total + ' meals checked · estimate proportional')
      ])
    ]));

    return wrap;

  function buildSparkline(u, iso) {
    const days = 14;
    const values = [];
    for (let i = days - 1; i >= 0; i--) {
      const d = shiftDate(iso, -i);
      const w = state.weights[u] && state.weights[u][d];
      values.push({ d, w: w != null ? w : null });
    }
    const nums = values.map(v => v.w).filter(v => v != null);
    if (nums.length < 2) return null;
    const lo = Math.min(...nums), hi = Math.max(...nums);
    const range = Math.max(0.5, hi - lo);
    const W = 300, H = 60, pad = 4;
    let d = '', prev = null;
    values.forEach((v, i) => {
      if (v.w == null) return;
      const x = (i / (days - 1)) * (W - pad * 2) + pad;
      const y = H - pad - ((v.w - lo) / range) * (H - pad * 2);
      d += (prev == null ? 'M' : 'L') + x.toFixed(1) + ' ' + y.toFixed(1) + ' ';
      prev = [x, y];
    });
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.setAttribute('preserveAspectRatio', 'none');
    svg.setAttribute('class', 'spark');
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', d.trim());
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', 'var(--steps)');
    path.setAttribute('stroke-width', '2');
    path.setAttribute('stroke-linecap', 'round');
    path.setAttribute('stroke-linejoin', 'round');
    svg.appendChild(path);
    // Dot on last point
    if (prev) {
      const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      c.setAttribute('cx', prev[0]); c.setAttribute('cy', prev[1]);
      c.setAttribute('r', 3); c.setAttribute('fill', 'var(--steps)');
      svg.appendChild(c);
    }
    return el('div', { class: 'spark-wrap' }, [
      el('div', { class: 'spark-head' }, [
        el('span', { class: 'spark-title' }, 'Last 14 days'),
        el('span', { class: 'spark-range' }, lo.toFixed(1) + '–' + hi.toFixed(1) + ' kg')
      ]),
      svg
    ]);
  }

  function renderDate() {
    const d = parseISO(state.date);
    const wk = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][d.getDay()];
    const month = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
    document.getElementById('date-day').textContent = wk;
    document.getElementById('date-full').textContent = `${d.getDate()} ${month} ${d.getFullYear()}`;
    const day = DAYS[DAY_INDEX[d.getDay()]];
    const kind = document.getElementById('day-kind');
    kind.className = 'day-kind ' + day.kind;
    kind.textContent = day.kindLabel;
    document.getElementById('today-btn').style.display = (state.date === todayISO()) ? 'none' : 'inline';
  }

  function renderProgress() {
    const day = DAYS[DAY_INDEX[dowFromISO(state.date)]];
    let done, total;
    if (state.tab === 'over') {
      const p = dayProgress(day);
      done = p.done; total = p.total;
    } else {
      const ids = taskIdsForDay(day, state.tab);
      done = ids.filter(id => isChecked(id)).length;
      total = ids.length;
    }
    const pct = total === 0 ? 0 : (done / total) * 100;
    document.getElementById('progress-fill').style.width = pct + '%';
    document.getElementById('progress-text').textContent = `${done} / ${total}`;
  }

  function renderContent() {
    const day = DAYS[DAY_INDEX[dowFromISO(state.date)]];
    const main = document.getElementById('tab-content');
    main.innerHTML = '';
    if (state.tab === 'over')      main.append(renderOverview(day));
    else if (state.tab === 'prep') main.append(renderPrep(day));
    else if (state.tab === 'shop') main.append(renderShop(day));
    else if (state.tab === 'eat')  main.append(renderEat(day));
    else if (state.tab === 'move') main.append(renderMove(day));
    else if (state.tab === 'log')  main.append(renderLog(day));
  }

  function renderTabs() {
    const day = DAYS[DAY_INDEX[dowFromISO(state.date)]];
    const w = document.getElementById('tab-bar');
    w.innerHTML = '';
    TABS.forEach(t => {
      let pill;
      if (t.key === 'over') {
        const p = dayProgress(day);
        pill = p.total === 0 ? '—' : `${p.done}/${p.total}`;
      } else {
        const ids = taskIdsForDay(day, t.key);
        const doneCount = ids.filter(id => isChecked(id)).length;
        pill = ids.length === 0 ? '—' : `${doneCount}/${ids.length}`;
      }
      w.append(el('button', {
        class: state.tab === t.key ? 'active' : '',
        onClick: () => { state.tab = t.key; saveState(state); renderAll(); }
      }, [
        el('span', { class: 'tab-icon', html: ICONS[t.key] }),
        el('span', {}, t.label),
        el('span', { class: 'tab-pill' }, pill)
      ]));
    });
  }

  function renderAll() {
    renderUserToggle();
    renderDate();
    renderProgress();
    renderContent();
    renderTabs();
  }

  let currentRecipeKey = null;
  let currentVideoIdx = 0;

  function openRecipe(key) {
    const r = RECIPES[key];
    if (!r) return;
    currentRecipeKey = key;
    currentVideoIdx = 0;
    document.getElementById('recipe-title').textContent = r.title;
    renderRecipeBody();
    document.getElementById('recipe-backdrop').classList.add('show');
    document.getElementById('recipe-modal').classList.add('show');
  }

  function renderRecipeBody() {
    const r = RECIPES[currentRecipeKey];
    const body = document.getElementById('recipe-body');
    body.innerHTML = '';

    if (r.subtitle) body.append(el('p', { class: 'recipe-subtitle' }, r.subtitle));

    // Video carousel
    if (r.videos && r.videos.length > 0) {
      const carousel = el('div', { class: 'recipe-carousel' });
      // Tab pills (only if more than one video)
      if (r.videos.length > 1) {
        const tabs = el('div', { class: 'recipe-tabs' });
        r.videos.forEach((v, i) => {
          tabs.append(el('button', {
            class: 'recipe-tab' + (i === currentVideoIdx ? ' active' : ''),
            onClick: () => { currentVideoIdx = i; renderRecipeBody(); }
          }, v.variant || ('#' + (i + 1))));
        });
        carousel.append(tabs);
      }
      const active = r.videos[currentVideoIdx];
      const frame = document.createElement('iframe');
      frame.src = `https://www.youtube-nocookie.com/embed/${active.videoId}?rel=0&modestbranding=1`;
      frame.setAttribute('allow', 'accelerometer; encrypted-media; picture-in-picture');
      frame.setAttribute('allowfullscreen', '');
      carousel.append(el('div', { class: 'recipe-frame-wrap' }, [ frame ]));
      // Caption
      const cap = el('div', { class: 'recipe-video-caption' });
      cap.append(el('span', {}, (active.title || '') + (active.channel ? ' · ' + active.channel : '')));
      if (active.url) {
        const a = document.createElement('a');
        a.href = active.url; a.target = '_blank'; a.rel = 'noopener';
        a.textContent = 'OPEN IN YOUTUBE';
        cap.append(a);
      }
      carousel.append(cap);
      body.append(carousel);
    } else {
      body.append(el('div', { class: 'no-videos-note' },
        'Video walkthroughs coming — ingredients and steps below.'));
    }

    // Ingredients
    body.append(el('h3', { class: 'recipe-section-h' }, 'Ingredients'));
    const ing = el('ul', { class: 'recipe-ingredients' });
    r.ingredients.forEach(i => {
      // Replace **X** markers with <b>
      const html = i.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
      ing.append(el('li', { html }));
    });
    body.append(ing);

    // Steps
    body.append(el('h3', { class: 'recipe-section-h' }, 'Steps'));
    const st = el('ol', { class: 'recipe-steps' });
    r.steps.forEach(s => st.append(el('li', {}, s)));
    body.append(st);
  }

  function closeRecipe() {
    document.getElementById('recipe-modal').classList.remove('show');
    document.getElementById('recipe-backdrop').classList.remove('show');
    // Clear iframe src to stop playback
    const iframe = document.querySelector('#recipe-body iframe');
    if (iframe) iframe.src = 'about:blank';
    currentRecipeKey = null;
    currentVideoIdx = 0;
  }

  // Video modal
  function openVideo(exerciseName, vid) {
    document.getElementById('video-title').textContent = exerciseName;
    document.getElementById('video-frame').src = `https://www.youtube-nocookie.com/embed/${vid.videoId}?rel=0&modestbranding=1`;
    const metaEl = document.getElementById('video-meta');
    metaEl.innerHTML = '';
    if (vid.channel) {
      const c = document.createElement('span');
      c.textContent = vid.title + ' · ' + vid.channel + '   ';
      metaEl.appendChild(c);
    }
    if (vid.url) {
      const a = document.createElement('a');
      a.href = vid.url; a.target = '_blank'; a.rel = 'noopener';
      a.textContent = 'OPEN ON YOUTUBE';
      metaEl.appendChild(a);
    }
    document.getElementById('video-backdrop').classList.add('show');
    document.getElementById('video-modal').classList.add('show');
  }
  function closeVideo() {
    document.getElementById('video-modal').classList.remove('show');
    document.getElementById('video-backdrop').classList.remove('show');
    document.getElementById('video-frame').src = 'about:blank'; // stop playback
  }
  document.getElementById('video-close').addEventListener('click', closeVideo);
  document.getElementById('video-backdrop').addEventListener('click', closeVideo);

  // Recipe modal wiring
  document.getElementById('recipe-close').addEventListener('click', closeRecipe);
  document.getElementById('recipe-backdrop').addEventListener('click', closeRecipe);

  // Swipe to change day
  let touchStartX = null, touchStartY = null;
  document.addEventListener('touchstart', (e) => {
    if (e.target.closest('.tabs') || e.target.closest('.head')) return;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });
  document.addEventListener('touchend', (e) => {
    if (touchStartX == null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) > 60 && Math.abs(dy) < 40) {
      state.date = shiftDate(state.date, dx > 0 ? -1 : 1);
      saveState(state); renderAll();
    }
    touchStartX = touchStartY = null;
  }, { passive: true });

  // ---------- PWA INSTALL ----------
  let deferredPrompt = null;
  const banner = document.getElementById('install-banner');
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    if (localStorage.getItem('rd:install-dismissed') !== '1') banner.classList.add('show');
  });
  document.getElementById('install-now').addEventListener('click', async () => {
    if (!deferredPrompt) { banner.classList.remove('show'); return; }
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    banner.classList.remove('show');
  });
  document.getElementById('install-later').addEventListener('click', () => {
    localStorage.setItem('rd:install-dismissed', '1');
    banner.classList.remove('show');
  });

  // ---------- SERVICE WORKER ----------
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }

  renderAll();
  if (__qsTab && TABS.some(t => t.key === __qsTab)) { state.tab = __qsTab; renderAll(); }
  if (__qsSettings) openSettings();
</script>
</body>
</html>
